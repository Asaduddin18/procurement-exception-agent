name: Verify procurement data, intake, and policy review

on:
  pull_request:
    paths:
      - 'seed/**'
      - 'mcp_server/**'
      - 'backend/**'
      - 'conftest.py'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/seed-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://procurement:procurement@127.0.0.1:5432/procurement
      TEST_DATABASE_URL: postgresql://procurement:procurement@127.0.0.1:5432/procurement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r seed/requirements-test.txt -r mcp_server/requirements.txt -r backend/requirements.txt
      - run: docker compose up -d --wait postgres
      - run: python -m seed.seed
      - run: timeout --signal=INT --kill-after=15s 110s python -m pytest -vv -o faulthandler_timeout=40 seed/tests mcp_server/tests backend/tests
      - name: Verify duplicate intake over HTTP
        run: |
          python -m uvicorn backend.api:create_app --factory --port 8000 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          api=http://127.0.0.1:8000
          curl --fail --silent --retry 5 --retry-connrefused "$api/openapi.json" > /dev/null
          pdf=seed/sample_pdfs/PO-2026-419_Apex_Overcharge.pdf
          temp_dir=$(mktemp -d)
          first=$(curl --fail --silent --show-error -o "$temp_dir/first.json" -w '%{http_code}' -F "file=@$pdf" "$api/api/v1/ingest")
          second=$(curl --fail --silent --show-error -o "$temp_dir/second.json" -w '%{http_code}' -F "file=@$pdf" "$api/api/v1/ingest")
          test "$first" = 202
          test "$second" = 200
          python - "$temp_dir" <<'PYCODE'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          new = json.loads((path / "first.json").read_text())
          duplicate = json.loads((path / "second.json").read_text())
          assert new["status"] == "queued"
          assert duplicate["status"] == "duplicate_ignored"
          assert new["run_id"] == duplicate["run_id"]
          assert new["thread_id"] == duplicate["thread_id"]
          print("Verified HTTP 202 followed by HTTP 200 duplicate_ignored.")
          PYCODE
      - if: always()
        run: docker compose down -v
