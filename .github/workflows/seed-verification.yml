name: Verify procurement data and MCP evidence

on:
  pull_request:
    paths:
      - 'seed/**'
      - 'mcp_server/**'
      - 'conftest.py'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/seed-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://procurement:procurement@127.0.0.1:5432/procurement
      TEST_DATABASE_URL: postgresql://procurement:procurement@127.0.0.1:5432/procurement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r seed/requirements-test.txt -r mcp_server/requirements.txt
      - run: docker compose up -d --wait postgres
      - run: python -m seed.seed
      - run: python -m pytest -q seed/tests mcp_server/tests
      - if: always()
        run: docker compose down -v
