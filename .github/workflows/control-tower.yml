name: Verify Control Tower in Chromium

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'mcp_server/**'
      - 'seed/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.example'
      - '.github/workflows/control-tower.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run typecheck
      - name: Start the evaluator Compose stack
        run: |
          cp .env.example .env
          docker compose up --detach --build
          curl -fsS --max-time 5 --retry 25 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/api/procurement/runs >/dev/null
      - run: npm exec --prefix frontend -- playwright install chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-tower-browser-results
          path: frontend/test-results/
      - if: failure()
        run: docker compose logs --no-color --tail=120
      - if: always()
        run: docker compose down -v
